<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AdBridge – Advertise</title>
<meta name="description" content="અમારી એપમાં જાહેરાત આપો · हमारे ऐप में विज्ञापन दें · Advertise in our apps">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="places.js"></script>
<script src="core.js"></script>
<style id="css"></style>
<style>
/* ---------- frame ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;height:60px}
.wrap{max-width:1120px}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;letter-spacing:-.2px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
.lang{display:flex;background:#F2F4F7;border-radius:10px;padding:3px}.lang button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:13px;min-width:40px}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.hero{padding:32px 0 8px}.hero h1{font-size:30px;line-height:1.25;margin:0 0 8px;letter-spacing:-.4px}.hero p{margin:0;color:var(--muted);font-size:16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0 24px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 340px}.bar{display:none!important}.aside{display:block!important}}
.aside{display:none;position:sticky;top:60px}
.card{margin:16px 0}
/* ---------- intro ---------- */
.intro{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media (min-width:640px){.intro{grid-template-columns:1fr 1fr}}
.intro>*{min-width:0}.intro small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:8px}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.why li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.why li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:var(--brandSoft);color:var(--brand);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
/* ---------- apps ---------- */
.apps{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.apps{grid-template-columns:1fr 1fr}}
.appc{position:relative;display:flex;gap:12px;border:1px solid var(--line2);border-radius:14px;padding:14px;background:#fff;text-align:left;cursor:pointer;width:100%;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.appc:hover{border-color:#98A2B3}.appc.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand),0 0 0 4px var(--brandSoft)}
.ic{width:52px;height:52px;border-radius:13px;background:var(--brandSoft);color:var(--brand);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border:1px solid var(--line);text-decoration:none}
.ic img{width:100%;height:100%;object-fit:cover}
.appc .tx{flex:1;min-width:0}.appc b{display:block;font-size:16px;font-weight:700;padding-right:26px}
.appc .co{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--ink2)}.stats span{display:inline-flex;align-items:center;gap:4px}.stats svg{width:14px;height:14px;fill:var(--muted)}
.store{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;border:1px solid #CDE7D8;background:#F6FBF8;border-radius:8px;padding:5px 10px}
.store:hover{background:var(--brandSoft)}
.appc a{text-decoration:none;color:inherit}.appc .radio{position:absolute;top:14px;right:14px}.appc.on .radio{border:6px solid var(--brand)}
/* ---------- steps ---------- */
.loc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
.fresh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.fresh:empty{display:none}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:#17B26A;flex:none}.fresh.old .dot{background:#F79009}.fresh.old{color:var(--warn)}
.fresh button{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:2px 0;font-size:13px}
/* ---------- how it works ---------- */
.how{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.how{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.how{grid-template-columns:repeat(4,1fr)}}
.how div{background:#F9FAFB;border:1px solid var(--line);border-radius:12px;padding:14px}
.how .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.how b{display:block;font-size:14px}.how p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.sub-h{font-size:15px;font-weight:700;margin:22px 0 10px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp th,.cmp td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.cmp tr:last-child td{border-bottom:0}
.cmp th{background:#F9FAFB;font-size:13px}.cmp td:first-child{color:var(--muted);width:30%}
.places{list-style:none;margin:0;padding:0;display:grid;gap:8px}.places li{font-size:14px;color:var(--ink2);padding-left:18px;position:relative}.places li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
/* ---------- summary (desktop aside + mobile bar) ---------- */
.sumcard h3{margin:0 0 6px;font-size:15px}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}.srow span:first-child{color:var(--muted);flex:none}.srow b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 12px}.total span{color:var(--muted);font-size:13px}.total b{font-size:26px;letter-spacing:-.4px}
.bookbtn{width:100%;min-height:52px;font-size:16px;border-radius:12px}
.hintline{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}
.bar{position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,24,40,.06)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar .info{min-width:0;flex:1}
.bar small{color:var(--muted);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar b{font-size:22px;letter-spacing:-.3px}
.bar .bookbtn{width:auto;min-width:150px;padding:12px 20px}
/* ---------- booking form ---------- */
.sum2{display:flex;gap:12px;align-items:center;background:#F9FAFB;border:1px solid var(--line);border-radius:12px;padding:12px}
.sum2 .ic{width:44px;height:44px;border-radius:11px;font-size:18px}.sum2 .tx{flex:1;min-width:0;font-size:13px;color:var(--ink2)}.sum2 .tx b{display:block;font-size:15px;color:var(--ink)}
.sum2 .pr{text-align:right;font-weight:800;font-size:18px;color:var(--brand);white-space:nowrap}
.grp{margin-top:20px}.grp>h4{margin:0;font-size:14px;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--line)}
.inp{position:relative}.inp input,.inp textarea{padding-right:50px}
.mic{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--brandSoft);color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic svg{width:18px;height:18px;fill:currentColor}.mic.on{background:#D92D20;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,45,32,.45)}100%{box-shadow:0 0 0 10px rgba(217,45,32,0)}}
.cnt{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.two{display:grid;grid-template-columns:1fr;gap:0 12px}@media (min-width:520px){.two{grid-template-columns:1fr 1fr}}
.prev{margin-top:12px}
.sendbar{position:sticky;bottom:-18px;background:#fff;padding:12px 0 18px;margin-top:14px;border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;color:var(--ink2)}.check input{width:18px;height:18px;min-height:0;accent-color:var(--brand)}
.err{color:var(--bad);font-size:12px;margin-top:4px;display:none}.bad .err{display:block}.bad input{border-color:var(--bad)}
.hp{position:absolute;left:-5000px}
.done{text-align:center;padding:28px 0 8px}.done .big{width:64px;height:64px;border-radius:50%;background:#ECFDF3;color:#067647;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done h2{margin:0 0 6px;font-size:20px;justify-content:center}.done p{color:var(--ink2);margin:0 0 18px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin:20px 0 28px}
@media (max-width:420px){.hero{padding-top:24px}.hero h1{font-size:24px}.bar b{font-size:19px}.bar .bookbtn{min-width:0;padding:12px 16px}.card{padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i>A</i>AdBridge</div>
  <div class="lang" id="lang"><button data-l="gu">ગુ</button><button data-l="hi">हि</button><button data-l="en">En</button></div>
</div></header>

<section class="hero"><div class="wrap"><h1 data-t="title"></h1><p data-t="sub"></p></div></section>

<div class="wrap layout">
  <main>
    <div class="card intro">
      <ul class="why"><li data-t="why1"></li><li data-t="why2"></li><li data-t="why3"></li></ul>
      <div><small data-t="adPreview"></small><div id="adSample"></div></div>
    </div>

    <div class="card" id="appCard">
      <h2><span class="n">1</span><span data-t="step0"></span></h2>
      <div class="apps" id="apps"><p class="muted" data-t="loading"></p></div>
    </div>

    <div class="card">
      <h2><span class="n" data-n="2"></span><span data-t="step1"></span></h2>
      <div class="seg" id="aType"></div>
      <div class="grid" style="margin-top:12px">
        <button class="selbtn" id="stateBtn"><span><small data-t="state"></small><b id="stateVal"></b></span></button>
        <button class="selbtn" id="distBtn"><span><small data-t="district"></small><b id="distVal"></b></span></button>
      </div>
      <div class="loc" id="locRow"><button class="linkbtn" id="findMe">📍 <span data-t="findMe"></span></button><span class="muted" id="locMsg"></span></div>
    </div>

    <div class="card">
      <h2><span class="n" data-n="3"></span><span data-t="step2"></span></h2>
      <label class="f" data-t="startDate" style="margin-top:0"></label>
      <div class="chips" id="startChips"></div>
      <label class="f" data-t="months"></label>
      <div class="chips" id="monthChips"></div>
      <p class="muted" id="period" style="margin-top:12px"></p>
    </div>

    <div class="card">
      <h2><span class="n" data-n="4"></span><span data-t="step3"></span></h2>
      <div id="plans"><p class="muted" data-t="loading"></p></div>
      <div class="fresh" id="fresh1"></div>
    </div>

    <div class="card">
      <h2 data-t="howTitle"></h2>
      <div class="how" id="how"></div>
      <div class="sub-h" data-t="plansTitle"></div>
      <table class="cmp" id="cmp"></table>
      <div class="sub-h" data-t="placesTitle"></div>
      <ul class="places" id="placesHelp"></ul>
      <p class="note ok" data-t="discNote" style="margin-top:16px"></p>
    </div>
    <p class="foot" data-t="foot"></p>
  </main>

  <aside class="aside"><div class="card sumcard" id="sumCard"></div></aside>
</div>

<div class="bar"><div class="wrap">
  <div class="info"><small id="barLbl"></small><b id="barPrice">—</b></div>
  <button class="btn main bookbtn" id="bookBtn" disabled></button>
</div></div>

<script src="portal.js"></script>
</body>
</html>
