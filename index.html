<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AdBridge – Advertise</title>
<meta name="description" content="અમારી એપમાં જાહેરાત આપો · हमारे ऐप में विज्ञापन दें · Advertise in our apps">
<script src="places.js"></script>
<script src="core.js"></script>
<style id="css"></style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;height:58px}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.lang{display:flex;background:#F2F4F7;border-radius:10px;padding:3px}.lang button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:700;font-size:13px;min-width:38px}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.hero{padding:28px 0 8px}
.hero h1{font-size:26px;line-height:1.3;margin:0 0 6px;letter-spacing:-.3px}.hero>.wrap>p{margin:0;color:var(--muted);font-size:15px}
.intro{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media (min-width:640px){.intro{grid-template-columns:1.1fr 1fr}}
.intro small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:8px}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.why li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.why li::before{content:"✓";width:20px;height:20px;border-radius:50%;background:var(--brandSoft);color:var(--brand);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.apps{display:flex;flex-direction:column;gap:8px}
.appc{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;cursor:pointer;width:100%}
.appc:hover{border-color:#98A2B3}.appc.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#FBFEFC}
.appc .av{width:40px;height:40px;border-radius:10px;background:var(--brandSoft);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.appc .tx{flex:1;min-width:0}.appc b{display:block;font-weight:700}.appc small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appc .radio{margin-left:auto}.appc.on .radio{border:6px solid var(--brand)}
.loc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
details.help{padding:0}details.help summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.help summary::-webkit-details-marker{display:none}details.help summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:400}details.help[open] summary::after{content:"–"}
details.help ul{margin:0;padding:0 18px 16px 36px;font-size:14px;color:var(--ink2)}details.help li{margin:4px 0}
.bar{position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar .info{min-width:0}
.bar small{color:var(--muted);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar b{font-size:22px;color:var(--ink);letter-spacing:-.3px}
.sum{background:#F9FAFB;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:14px}.sum div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.sum div:last-child{border:0}
.sum div span:first-child{color:var(--muted)}.sum div b{text-align:right;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;color:var(--ink2)}.check input{width:18px;height:18px;min-height:0;accent-color:var(--brand)}
.err{color:var(--bad);font-size:12px;margin-top:4px;display:none}.bad .err{display:block}.bad input{border-color:var(--bad)}
.hp{position:absolute;left:-5000px}
.done{text-align:center;padding:28px 0 8px}.done .big{width:64px;height:64px;border-radius:50%;background:#ECFDF3;color:#067647;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done h2{margin:0 0 6px;font-size:20px}.done p{color:var(--ink2);margin:0 0 18px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin:18px 0 24px}
@media (max-width:420px){.hero h1{font-size:22px}.bar b{font-size:19px}.bar .btn{padding:12px 14px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i>A</i>AdBridge</div>
  <div class="lang" id="lang"><button data-l="gu">ગુ</button><button data-l="hi">हि</button><button data-l="en">En</button></div>
</div></header>

<section class="hero"><div class="wrap">
  <h1 data-t="title"></h1><p data-t="sub"></p>
</div></section>

<main class="wrap">
  <div class="card intro">
    <ul class="why"><li data-t="why1"></li><li data-t="why2"></li><li data-t="why3"></li></ul>
    <div><small data-t="adPreview"></small>
      <div class="ad"><div class="t"><span class="lbl" data-t="adLbl"></span><b data-t="adName"></b><span class="d" data-t="adText"></span></div><i>💬</i><i>📞</i><i>➜</i></div></div>
  </div>

  <div class="card" id="appCard">
    <h2><span class="n">1</span><span data-t="step0"></span></h2>
    <div class="apps" id="apps"><p class="muted" data-t="loading"></p></div>
  </div>

  <div class="card">
    <h2><span class="n" data-n="2"></span><span data-t="step1"></span></h2>
    <div class="seg" id="aType"></div>
    <div class="grid" style="margin-top:12px">
      <button class="selbtn" id="stateBtn"><span><small data-t="state"></small><b id="stateVal"></b></span></button>
      <button class="selbtn" id="distBtn"><span><small data-t="district"></small><b id="distVal"></b></span></button>
    </div>
    <div class="loc" id="locRow"><button class="linkbtn" id="findMe">📍 <span data-t="findMe"></span></button><span class="muted" id="locMsg"></span></div>
  </div>

  <div class="card">
    <h2><span class="n" data-n="3"></span><span data-t="step2"></span></h2>
    <label class="f" data-t="startDate" style="margin-top:0"></label>
    <div class="chips" id="startChips"></div>
    <label class="f" data-t="months"></label>
    <div class="chips" id="monthChips"></div>
    <p class="muted" id="period" style="margin-top:12px"></p>
  </div>

  <div class="card">
    <h2><span class="n" data-n="4"></span><span data-t="step3"></span></h2>
    <div id="plans"><p class="muted" data-t="loading"></p></div>
  </div>

  <details class="card help"><summary data-t="understand"></summary><ul id="help"></ul></details>
  <p class="foot" data-t="foot"></p>
</main>

<div class="bar"><div class="wrap">
  <div class="info"><small id="barLbl"></small><b id="barPrice">—</b></div>
  <button class="btn main" id="bookBtn" data-t="book" disabled></button>
</div></div>

<script src="portal.js"></script>
</body>
</html>
