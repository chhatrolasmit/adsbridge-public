<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F7A4D">
<title>AdBridge – Advertise</title>
<meta name="description" content="અમારી એપમાં જાહેરાત આપો · हमारे ऐप में विज्ञापन दें · Advertise in our apps">
<script src="places.js"></script>
<script src="core.js"></script>
<style id="css"></style>
<style>
header.hero{background:linear-gradient(135deg,#1F7A4D,#2a9a62);color:#fff;padding:18px 0 56px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}.brand i{width:28px;height:28px;border-radius:8px;background:#fff;color:#1F7A4D;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}.lang button{border:0;background:transparent;color:#fff;border-radius:999px;padding:6px 11px;cursor:pointer;font-weight:700;min-width:40px}
.lang button.on{background:#fff;color:#1F7A4D}
header.hero h1{font-size:24px;line-height:1.3;margin:18px 0 4px}header.hero p{margin:0;opacity:.9}
.lift{margin-top:-44px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.why div{display:flex;gap:10px;align-items:flex-start;font-size:14px}.why span{width:32px;height:32px;border-radius:10px;background:var(--brandSoft);display:flex;align-items:center;justify-content:center;flex:none}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.appc{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:left;cursor:pointer}.appc.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.appc b{display:block}.appc small{color:var(--muted)}
.loc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.bar{position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar small{color:var(--muted);display:block;font-size:12px}.bar b{font-size:22px;color:var(--brand)}
.sum{background:#f6f8f7;border-radius:12px;padding:10px 12px;font-size:14px}.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.sum div span:first-child{color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}.check input{width:20px;height:20px;min-height:0}
.err{color:var(--bad);font-size:12px;margin-top:4px;display:none}.bad .err{display:block}.bad input{border-color:var(--bad)}
.hp{position:absolute;left:-5000px}
.done{text-align:center;padding:10px 0}.done .big{font-size:48px}
@media (max-width:420px){header.hero h1{font-size:21px}.bar b{font-size:19px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="hero-top"><div class="brand"><i>A</i>AdBridge</div>
    <div class="lang" id="lang"><button data-l="gu">ગુ</button><button data-l="hi">हि</button><button data-l="en">En</button></div></div>
  <h1 data-t="title"></h1><p data-t="sub"></p>
</div></header>

<main class="wrap lift">
  <div class="card">
    <div class="ad"><div class="t"><span class="lbl" data-t="adLbl"></span><b data-t="adName"></b><span class="d" data-t="adText"></span></div><i>💬</i><i>📞</i><i>➜</i></div>
    <div class="why"><div><span>📱</span><p data-t="why1" style="margin:4px 0"></p></div><div><span>📌</span><p data-t="why2" style="margin:4px 0"></p></div><div><span>🤝</span><p data-t="why3" style="margin:4px 0"></p></div></div>
  </div>

  <div class="card" id="appCard">
    <h2><span class="n">1</span><span data-t="step0"></span></h2>
    <div class="apps" id="apps"><p class="muted" data-t="loading"></p></div>
  </div>

  <div class="card">
    <h2><span class="n">2</span><span data-t="step1"></span></h2>
    <div class="seg" id="aType"></div>
    <div class="grid" style="margin-top:10px">
      <button class="selbtn" id="stateBtn"><span><small data-t="state"></small><b id="stateVal"></b></span></button>
      <button class="selbtn" id="distBtn"><span><small data-t="district"></small><b id="distVal"></b></span></button>
    </div>
    <div class="loc" id="locRow"><button class="linkbtn" id="findMe">📍 <span data-t="findMe"></span></button><span class="muted" id="locMsg"></span></div>
  </div>

  <div class="card">
    <h2><span class="n">3</span><span data-t="step2"></span></h2>
    <label class="f" data-t="startDate"></label>
    <div class="chips" id="startChips"></div>
    <label class="f" data-t="months"></label>
    <div class="chips" id="monthChips"></div>
    <p class="muted" id="period" style="margin-top:10px"></p>
  </div>

  <div class="card">
    <h2><span class="n">4</span><span data-t="step3"></span></h2>
    <div id="plans"><p class="muted" data-t="loading"></p></div>
  </div>

  <div class="card">
    <h2 data-t="understand"></h2>
    <ul class="muted" style="font-size:14px;padding-left:18px;margin:0" id="help"></ul>
  </div>
  <p class="muted center" data-t="foot" style="margin-bottom:20px"></p>
</main>

<div class="bar"><div class="wrap">
  <div><small id="barLbl"></small><b id="barPrice">—</b></div>
  <button class="btn main" id="bookBtn" data-t="book" disabled></button>
</div></div>

<script src="portal.js"></script>
</body>
</html>
